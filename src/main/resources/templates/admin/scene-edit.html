<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title th:text="${scene != null} ? 'Szenario bearbeiten - ' + ${scene.title} : 'Neues Szenario'"></title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="page-header">
        <h1 th:text="${scene != null} ? 'Szenario bearbeiten: ' + ${scene.title} : 'Neues Einsatzszenario'"></h1>
        <a href="/admin/scenes">&larr; Zurueck zur Liste</a>
    </div>
    <div class="container">
        <form method="post" th:action="${scene != null} ? @{/admin/scenes/{id}(id=${scene.id})} : @{/admin/scenes/create}" id="editForm">
            <div class="form-section">
                <h2>Szenario-Daten</h2>
                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="title">Titel</label>
                        <input type="text" id="title" name="title" required th:value="${scene != null} ? ${scene.title} : ''" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="description">Beschreibung</label>
                        <textarea id="description" name="description" rows="3" th:text="${scene != null} ? ${scene.description} : ''"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="vehicleId">Einsatzfahrzeug (optional)</label>
                        <select id="vehicleId" name="vehicleId">
                            <option value="">-- Keines --</option>
                            <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.callsign}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Position (auf der Karte klicken)</h2>
                <input type="hidden" id="lat" name="lat" th:if="${scene != null}" th:value="${scene.lat}" />
                <input type="hidden" id="lat" name="lat" th:unless="${scene != null}" th:value="${defaultLat}" />
                <input type="hidden" id="lng" name="lng" th:if="${scene != null}" th:value="${scene.lng}" />
                <input type="hidden" id="lng" name="lng" th:unless="${scene != null}" th:value="${defaultLng}" />
                <div id="position-map"></div>
            </div>

            <button type="submit" class="btn btn-primary">Speichern</button>
        </form>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var lat = 53.5511;
            var lng = 9.9937;

            try {
                lat = parseFloat(document.getElementById('lat').value);
                lng = parseFloat(document.getElementById('lng').value);
            } catch(e) {}

            var map = L.map('position-map').setView([lat, lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            var marker = L.marker([lat, lng], { draggable: true }).addTo(map);

            marker.on('dragend', function(e) {
                var pos = e.target.getLatLng();
                document.getElementById('lat').value = pos.lat;
                document.getElementById('lng').value = pos.lng;
            });

            map.on('click', function(e) {
                marker.setLatLng(e.latlng);
                document.getElementById('lat').value = e.latlng.lat;
                document.getElementById('lng').value = e.latlng.lng;
            });

            var form = document.getElementById('editForm');
            form.addEventListener('submit', function() {
                lat = parseFloat(document.getElementById('lat').value);
                lng = parseFloat(document.getElementById('lng').value);
                document.getElementById('lat').value = lat.toFixed(6);
                document.getElementById('lng').value = lng.toFixed(6);
            });
        });
        /*]]>*/
    </script>
</body>
</html>
