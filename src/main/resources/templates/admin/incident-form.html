<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title th:if="${incident}">Einsatzort bearbeiten</title>
    <title th:unless="${incident}">Neuen Einsatzort anlegen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="admin-page">
        <aside th:replace="~{admin/_sidebar.html :: admin-sidebar}"></aside>
        <main class="admin-content">
            <div class="page-header">
                <div style="display:flex;align-items:center;">
                    <button type="button" class="hamburger-btn" onclick="toggleAdminSidebar()">&#9776;</button>
                    <h1 th:if="${incident}">Einsatzort bearbeiten</h1>
                    <h1 th:unless="${incident}">Neuen Einsatzort anlegen</h1>
                </div>
                <a th:href="@{/}">&larr; Karte anzeigen</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <form method="post" th:action="${incident} ? @{/admin/incidents/{id}(id=${incident.id})} : @{/admin/incidents}">
                    <input type="hidden" id="createLat" name="lat" th:value="${incident?.lat}" />
                    <input type="hidden" id="createLng" name="lng" th:value="${incident?.lng}" />
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required placeholder="z.B. Brand in Hafen City" th:value="${incident?.name}" />
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Beschreibung</label>
                            <textarea id="description" name="description" placeholder="Optional: zusätzliche Informationen" th:text="${incident?.description}"></textarea>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 1rem;">Koordinaten auswählen</h3>
                    
                    <div class="form-section">
                        <h2>Adresse suchen</h2>
                        <div id="geocode-search" style="display:flex;gap:8px;margin-bottom:8px;">
                            <input type="text" id="address-input" placeholder="Adresse eingeben (z.B. Rathausmarkt Hamburg)" style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;" />
                            <button type="button" id="search-address-btn" style="padding:6px 12px;background:#1976d2;color:white;border:none;border-radius:4px;cursor:pointer;">Adresse suchen</button>
                        </div>
                        <div id="geocode-error" class="flash-msg flash-error" style="display:none;"></div>
                    </div>
                    
                    <div class="form-section">
                        <h2>Position (auf der Karte klicken)</h2>
                        <div id="position-map"></div>
                    </div>
                    
                    <div th:if="${incident}">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="active">Aktiv</label>
                                <input type="checkbox" id="active" name="active" th:checked="${incident.active}" />
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" th:text="${incident} ? 'Update' : 'Anlegen'"></button>
                </form>
            </div>

            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    var lat = [[${incident?.lat} != null ? incident.lat : 53.5511]];
                    var lng = [[${incident?.lng} != null ? incident.lng : 9.9937]];

                    var map = L.map('position-map').setView([lat, lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(map);

                    var marker = L.marker([lat, lng], { draggable: true }).addTo(map);

                    marker.on('dragend', function(e) {
                        var pos = e.target.getLatLng();
                        document.getElementById('createLat').value = pos.lat;
                        document.getElementById('createLng').value = pos.lng;
                    });

                    map.on('click', function(e) {
                        marker.setLatLng(e.latlng);
                        document.getElementById('createLat').value = e.latlng.lat;
                        document.getElementById('createLng').value = e.latlng.lng;
                    });
                    
                    document.getElementById('search-address-btn').addEventListener('click', function() {
                        var addressInput = document.getElementById('address-input');
                        var address = addressInput.value.trim();
                        
                        if (!address) {
                            showError('Bitte geben Sie eine Adresse ein');
                            return;
                        }
                        
                        hideError();
                        showLoading(true);
                        
                        fetch('/api/geocode?address=' + encodeURIComponent(address), {
                            credentials: 'same-origin'
                        })
                        .then(function(response) {
                            if (response.status === 200) {
                                return response.json();
                            } else if (response.status === 404) {
                                throw new Error('Adresse nicht gefunden');
                            } else {
                                throw new Error('Fehler beim Laden der Adresse');
                            }
                        })
                        .then(function(data) {
                            marker.setLatLng([data.lat, data.lng]);
                            map.panTo([data.lat, data.lng]);
                            document.getElementById('createLat').value = data.lat.toFixed(6);
                            document.getElementById('createLng').value = data.lng.toFixed(6);
                            addressInput.value = data.displayName;
                        })
                        .catch(function(err) {
                            showError(err.message || 'Fehler beim Laden der Adresse');
                        })
                        .finally(function() {
                            showLoading(false);
                        });
                    });
                    
                    function showError(message) {
                        var errorDiv = document.getElementById('geocode-error');
                        if (errorDiv) {
                            errorDiv.textContent = message;
                            errorDiv.style.display = 'block';
                        }
                    }
                    
                    function hideError() {
                        var errorDiv = document.getElementById('geocode-error');
                        if (errorDiv) {
                            errorDiv.style.display = 'none';
                        }
                    }
                    
                    function showLoading(isLoading) {
                        var btn = document.getElementById('search-address-btn');
                        if (isLoading) {
                            btn.textContent = 'Suche...';
                            btn.disabled = true;
                        } else {
                            btn.textContent = 'Adresse suchen';
                            btn.disabled = false;
                        }
                    }
                });
            </script>
        </main>
    </div>
</body>
</html>
