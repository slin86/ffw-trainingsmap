<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title th:text="${incident != null} ? 'Einsatzort bearbeiten' : 'Neuen Einsatzort anlegen'"></title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="admin-page">
        <aside th:replace="~{admin/_sidebar.html :: admin-sidebar}"></aside>
        <main class="admin-content">
            <div class="page-header">
                <h1 th:text="${incident != null} ? 'Einsatzort bearbeiten' : 'Neuen Einsatzort anlegen'"></h1>
                <a th:href="@{/admin/incidents(all=true)}">&larr; zurück zur Übersicht</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <form method="post" th:action="${incident != null} ? @{/admin/incidents/{id}(id=${incident.id})} : @{/admin/incidents}">
                    <input type="hidden" id="formLat" name="lat" />
                    <input type="hidden" id="formLng" name="lng" />
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" th:value="${incident != null} ? ${incident.name} : ''" required placeholder="z.B. Brand in Hafen City" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Beschreibung</label>
                            <textarea id="description" name="description" th:text="${incident != null} ? ${incident.description} : ''" rows="3" placeholder="Optionale Beschreibung"></textarea>
                        </div>
                    </div>

                    <div class="form-row" th:if="${incident != null}">
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="active" name="active" th:checked="${incident.active}" />
                                Aktiv
                            </label>
                        </div>
                    </div>

                    <h3 style="margin-top: 1rem;">Koordinaten auswählen</h3>
                    <div class="form-section">
                        <h2>Position (auf der Karte klicken oder Marker ziehen)</h2>
                        <div id="position-map"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" th:text="${incident != null} ? 'Speichern' : 'Anlegen'"></button>
                </form>
            </div>

            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    var lat = 53.5511;
                    var lng = 9.9937;

                    #[
                        if (${incident != null}) {
                            lat = ${incident.lat};
                            lng = ${incident.lng};
                        }
                    ]#

                    var map = L.map('position-map').setView([lat, lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(map);

                    var marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                    document.getElementById('formLat').value = lat;
                    document.getElementById('formLng').value = lng;

                    marker.on('dragend', function(e) {
                        var pos = e.target.getLatLng();
                        marker.setLatLng(pos);
                        document.getElementById('formLat').value = pos.lat;
                        document.getElementById('formLng').value = pos.lng;
                    });

                    map.on('click', function(e) {
                        marker.setLatLng(e.latlng);
                        document.getElementById('formLat').value = e.latlng.lat;
                        document.getElementById('formLng').value = e.latlng.lng;
                    });
                });
            </script>
        </main>
    </div>
</body>
</html>
