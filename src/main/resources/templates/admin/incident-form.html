<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title th:text="${incident != null} ? 'Einsatzort bearbeiten' : 'Neuen Einsatzort anlegen'"></title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="admin-page">
        <aside th:replace="~{admin/_sidebar.html :: admin-sidebar}"></aside>
        <main class="admin-content">
            <div class="page-header">
                <h1 th:text="${incident != null} ? 'Einsatzort bearbeiten' : 'Neuen Einsatzort anlegen'"></h1>
                <a th:href="@{/admin/incidents}">&larr; Zurück zur Übersicht</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <form th:if="${incident == null}" method="post" th:action="@{/admin/incidents}">
                    <input type="hidden" id="createLat" name="lat" />
                    <input type="hidden" id="createLng" name="lng" />
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required placeholder="z.B. Brand in Hafen City" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Beschreibung</label>
                            <textarea id="description" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <h3 style="margin-top: 1rem;">Koordinaten auswählen</h3>
                    <div class="form-section">
                        <h2>Position (auf der Karte klicken)</h2>
                        <div id="position-map"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Anlegen</button>
                </form>

                <form th:if="${incident != null}" method="post" th:action="@{/admin/incidents/{id}(id=${incident.id})}">
                    <input type="hidden" id="editLat" name="lat" class="edit-lat" />
                    <input type="hidden" id="editLng" name="lng" class="edit-lng" />
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required th:value="${incident.name}" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Beschreibung</label>
                            <textarea id="description" name="description" rows="3" th:text="${incident.description}"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group checkbox">
                            <label>
                                <input type="checkbox" name="active" th:checked="${incident.active}" /> Aktiv
                            </label>
                        </div>
                    </div>
                    <h3 style="margin-top: 1rem;">Koordinaten auswählen</h3>
                    <div class="form-section">
                        <h2>Position (auf der Karte klicken)</h2>
                        <div id="position-map"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Speichern</button>
                </form>

                <script th:inline="javascript">
                    document.addEventListener('DOMContentLoaded', function() {
                        var lat = /*[[${incident != null ? incident.lat : 53.5511}]]*/ 53.5511;
                        var lng = /*[[${incident != null ? incident.lng : 9.9937}]]*/ 9.9937;

                        var map = L.map('position-map').setView([lat, lng], 13);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19
                        }).addTo(map);

                        var marker = L.marker([lat, lng], { draggable: true }).addTo(map);

                        marker.on('dragend', function(e) {
                            var pos = e.target.getLatLng();
                            var el = document.getElementById(lat > 0 ? 'editLat' : 'createLat');
                            var lngEl = document.getElementById(lat > 0 ? 'editLng' : 'createLng');
                            if (el && el.name === 'lat') {
                                el.value = pos.lat;
                                lngEl.value = pos.lng;
                            } else {
                                el = document.getElementById('createLat');
                                lngEl = document.getElementById('createLng');
                                el.value = pos.lat;
                                lngEl.value = pos.lng;
                            }
                        });

                        map.on('click', function(e) {
                            marker.setLatLng(e.latlng);
                            var el = document.getElementById(lat > 0 ? 'editLat' : 'createLat');
                            var lngEl = document.getElementById(lat > 0 ? 'editLng' : 'createLng');
                            if (el && el.name === 'lat') {
                                el.value = e.latlng.lat;
                                lngEl.value = e.latlng.lng;
                            } else {
                                el = document.getElementById('createLat');
                                lngEl = document.getElementById('createLng');
                                el.value = e.latlng.lat;
                                lngEl.value = e.latlng.lng;
                            }
                        });
                    });
                </script>
            </div>
        </main>
    </div>
</body>
</html>
