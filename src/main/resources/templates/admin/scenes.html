<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einsatzszenarien - Verwaltung</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>
    <div class="page-header">
        <h1>Einsatzszenarien verwalten</h1>
        <a th:href="@{/admin/vehicles}">Fahrzeugverwaltung</a>
        <a href="/">&larr; Karte anzeigen</a>
    </div>
    <div class="container">
        <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
        <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

        <a href="/admin/scenes/create" class="btn btn-primary">Neues Einsatzszenario anlegen</a>

        <table style="margin-top: 1.5rem;">
            <thead>
                <tr>
                    <th>Titel</th>
                    <th>Beschreibung</th>
                    <th>Einsatzfahrzeug</th>
                    <th>Erstellt am</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${scenes}">
                    <td><strong th:text="${s.title}"></strong></td>
                    <td th:text="${s.description != null ? s.description : '-'}"></td>
                    <td th:text="${s.vehicle != null ? s.vehicle.callsign : '-'}"></td>
                    <td th:text="${#temporals.format(s.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="actions">
                        <a th:href="@{/admin/scenes/{id}/edit(id=${s.id})}" class="btn btn-edit btn-small">Bearbeiten</a>
                        <form method="post" th:action="@{/admin/scenes/{id}/delete(id=${s.id})}"
                              style="display:inline;" class="confirm-form"
                              onsubmit="return confirm('Einsatzszenario wirklich loeschen?')">
                            <button type="submit">Loeschen</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
