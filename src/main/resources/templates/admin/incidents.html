<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einsatzorte - Verwaltung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="admin-page">
        <aside th:replace="~{admin/_sidebar.html :: admin-sidebar}"></aside>
        <main class="admin-content">
            <div class="page-header">
                <div style="display:flex;align-items:center;">
                    <button type="button" class="hamburger-btn" onclick="toggleAdminSidebar()">&#9776;</button>
                    <h1>Einsatzorte verwalten</h1>
                </div>
                <a th:href="@{/}">&larr; Karte anzeigen</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <div style="margin-bottom: 1rem;">
                    <a th:href="@{/admin/incidents}" class="btn btn-secondary">Nur Aktive</a>
                    <a th:href="@{/admin/incidents(all=true)}" class="btn btn-secondary" th:classappend="${showAll} ? 'btn-active' : ''">Alle Anzeigen</a>
                </div>

                <a th:href="@{/admin/incidents/new}" class="btn btn-primary">Neuen Einsatzort anlegen</a>

                <h2>Einsatzorte</h2>
                <table th:if="${incidents != null and !incidents.empty}">
                    <head>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Koordinaten</th>
                            <th>Aktionen</th>
                        </tr>
                    </head>
                    <tbody>
                        <tr th:each="i : ${incidents}">
                            <td><strong th:text="${i.name}"></strong></td>
                            <td>
                                <span th:if="${i.active}" style="color:#2ecc71;">[Aktiv]</span>
                                <span th:unless="${i.active}" style="color:#95a5a6;">[Inaktiv]</span>
                            </td>
                            <td><span th:text="${#numbers.formatDecimal(i.lat, 4, 2)} + ', ' + ${#numbers.formatDecimal(i.lng, 4, 2)}"></span></td>
                            <td class="actions">
                                <form method="post" th:action="@{/admin/incidents/{id}/toggle(id=${i.id})}" style="display:inline;" class="confirm-form">
                                    <button type="submit" th:text="${i.active} ? 'Deaktivieren' : 'Aktivieren'"></button>
                                </form>
                                <a th:href="@{/admin/incidents/{id}/edit(id=${i.id})}" class="btn btn-secondary">Bearbeiten</a>
                                <form method="post" th:action="@{/admin/incidents/{id}/delete(id=${i.id})}" style="display:inline;" class="confirm-form" onsubmit="return confirm('Einsatzort wirklich löschen?')">
                                    <button type="submit">Löschen</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${incidents == null or incidents.empty}" style="color:#666;" th:text="${showAll} ? 'Keine Einsatzorte gefunden.' : 'Keineaktiven Einsatzorte gefunden.'"></p>
            </div>

            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    var lat = 53.5511;
                    var lng = 9.9937;

                    var map = L.map('position-map').setView([lat, lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(map);

                    var marker = L.marker([lat, lng], { draggable: true }).addTo(map);

                    marker.on('dragend', function(e) {
                        var pos = e.target.getLatLng();
                        document.getElementById('createLat').value = pos.lat;
                        document.getElementById('createLng').value = pos.lng;
                    });

                    map.on('click', function(e) {
                        marker.setLatLng(e.latlng);
                        document.getElementById('createLat').value = e.latlng.lat;
                        document.getElementById('createLng').value = e.latlng.lng;
                    });
                });
            </script>
        </main>
    </div>
</body>
</html>
