<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Einsatzorte - Verwaltung</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>
    <div class="admin-page">
        <aside th:replace="~{admin/_sidebar.html :: admin-sidebar}"></aside>
        <main class="admin-content">
            <div class="page-header">
                <h1>Einsatzorte verwalten</h1>
                <a th:href="@{/}">&larr; Karte anzeigen</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <div style="margin-bottom: 1rem;">
                    <a th:href="@{/admin/incidents}" class="btn btn-secondary">Nur Aktive</a>
                    <a th:href="@{/admin/incidents(all=true)}" class="btn btn-secondary" th:classappend="${showAll} ? 'btn-active' : ''">Alle Anzeigen</a>
                </div>

                <div style="margin-bottom: 1rem;">
                    <a th:href="@{/admin/incidents/new}" class="btn btn-primary">Neuen Ort anlegen</a>
                </div>

                <h2>Einsatzorte</h2>
                <table th:if="${incidents != null and !incidents.empty}">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Koordinaten</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="i : ${incidents}">
                            <td><strong th:text="${i.name}"></strong></td>
                            <td>
                                <span th:if="${i.active}" style="color:#2ecc71;">[Aktiv]</span>
                                <span th:unless="${i.active}" style="color:#95a5a6;">[Inaktiv]</span>
                            </td>
                            <td><span th:text="${#numbers.formatDecimal(i.lat, 4, 2)} + ', ' + ${#numbers.formatDecimal(i.lng, 4, 2)}"></span></td>
                            <td class="actions">
                                <a th:href="@{/admin/incidents/{id}/edit(id=${i.id})}" class="btn btn-edit btn-small">Bearbeiten</a>
                                <form method="post" th:action="@{/admin/incidents/{id}/toggle(id=${i.id})}" style="display:inline;" class="confirm-form">
                                    <button type="submit" th:text="${i.active} ? 'Deaktivieren' : 'Aktivieren'"></button>
                                </form>
                                <form method="post" th:action="@{/admin/incidents/{id}/delete(id=${i.id})}" style="display:inline;" class="confirm-form" onsubmit="return confirm('Einsatzort wirklich löschen?')">
                                    <button type="submit">Löschen</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${incidents == null or incidents.empty}" style="color:#666;" th:text="${showAll} ? 'Keine Einsatzorte gefunden.' : 'Keine aktiven Einsatzorte gefunden.'"></p>
            </div>
        </main>
    </div>
</body>
</html>
