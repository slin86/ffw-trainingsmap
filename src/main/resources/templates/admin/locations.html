<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <title>Orte - Verwaltung</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>
    <div class="admin-page">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <ul>
                    <li th:class="${currentPage == 'vehicles' ? 'active' : ''}">
                        <a th:href="@{/admin/vehicles}">Fahrzeuge</a>
                    </li>
                    <li th:class="${currentPage == 'users' ? 'active' : ''}">
                        <a th:href="@{/admin/users}">Nutzer</a>
                    </li>
                    <li th:class="${currentPage == 'locations' ? 'active' : ''}">
                        <a th:href="@{/admin/locations}">Orte</a>
                    </li>
                </ul>
            </nav>
            <div class="admin-sidebar-footer">
                <a th:href="@{/}">&larr; Karte anzeigen</a>
            </div>
        </aside>
        <main class="admin-content">
            <div class="page-header">
                <h1>Orte verwalten</h1>
                <a th:href="@{/}">&larr; Karte anzeigen</a>
            </div>
            <div class="container">
                <div th:if="${flashMessage}" class="flash-msg" th:text="${flashMessage}"></div>
                <div th:if="${flashError}" class="flash-msg flash-error" th:text="${flashError}"></div>

                <div class="form-section">
                    <h2>Neuen Ort anlegen</h2>
                    <form method="post" th:action="@{/admin/locations}">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="type">Typ</label>
                                <select id="type" name="type" required>
                                    <option value="STATION">Feuerwache</option>
                                    <option value="INCIDENT">Einsatzort</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required placeholder="z.B. Feuerwache 1" />
                            </div>
                            <div class="form-group">
                                <label for="lat">Breitengrad</label>
                                <input type="number" id="lat" name="lat" step="0.000001" required placeholder="53.55" min="53.3" max="53.8" />
                            </div>
                            <div class="form-group">
                                <label for="lng">Laengengrad</label>
                                <input type="number" id="lng" name="lng" step="0.000001" required placeholder="9.99" min="9.6" max="10.4" />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Anlegen</button>
                    </form>
                </div>

                <h2>Feuerwachen (Stationen)</h2>
                <table th:if="${stations != null and !stations.empty}">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Koordinaten</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${stations}">
                            <td><strong th:text="${s.name}"></strong></td>
                            <td><span th:text="${#numbers.formatDecimal(s.lat, 4, 2)} + ', ' + ${#numbers.formatDecimal(s.lng, 4, 2)}"></span></td>
                            <td class="actions">
                                <form method="post" th:action="@{/admin/locations/{id}/delete(id=${s.id})}" style="display:inline;" class="confirm-form" onsubmit="return confirm('Ort wirklich loeschen?')">
                                    <button type="submit">Loeschen</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <h2>Einsatzorte (Incidents)</h2>
                <table th:if="${incidents != null and !incidents.empty}">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Koordinaten</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="i : ${incidents}">
                            <td><strong th:text="${i.name}"></strong></td>
                            <td>
                                <span th:if="${i.active}" style="color:#2ecc71;">[Aktiv]</span>
                                <span th:unless="${i.active}" style="color:#95a5a6;">[Inaktiv]</span>
                            </td>
                            <td><span th:text="${#numbers.formatDecimal(i.lat, 4, 2)} + ', ' + ${#numbers.formatDecimal(i.lng, 4, 2)}"></span></td>
                            <td class="actions">
                                <form method="post" th:action="@{/admin/locations/toggle/{id}(id=${i.id})}" style="display:inline;" class="confirm-form">
                                    <button type="submit" th:text="${i.active} ? 'Deaktivieren' : 'Aktivieren'"></button>
                                </form>
                                <form method="post" th:action="@{/admin/locations/{id}/delete(id=${i.id})}" style="display:inline;" class="confirm-form" onsubmit="return confirm('Ort wirklich loeschen?')">
                                    <button type="submit">Loeschen</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${stations == null or stations.empty}" style="color:#666;">Keine Feuerwachen gefunden.</p>
                <p th:if="${incidents == null or incidents.empty}" style="color:#666;">Keine aktiven Einsatzorte gefunden.</p>
            </div>
        </main>
    </div>
</body>
</html>
